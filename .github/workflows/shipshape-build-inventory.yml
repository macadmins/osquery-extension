# Reusable action pinned to reviewed standalone source.
name: Unsigned osquery build inventory (manual)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed default-head SHA containing this workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osquery-extension-unsigned-build-inventory
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact current source and workflow
        uses: macadmins/shipshape-action@0ec3587a63e1f0fc18ef0fd4e44f5b8753ab1149
        with:
          phase: validate
          expected-repository: macadmins/osquery-extension
          expected-repository-id: '273057431'
          source-sha: ${{ inputs.source_sha }}
          expected-workflow: .github/workflows/shipshape-build-inventory.yml
          expected-branch: main
          expected-version: '1.5.5'

  build:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Build and collect unsigned diagnostic outputs
        uses: macadmins/shipshape-action@0ec3587a63e1f0fc18ef0fd4e44f5b8753ab1149
        with:
          phase: build
          expected-repository: macadmins/osquery-extension
          expected-repository-id: '273057431'
          source-sha: ${{ inputs.source_sha }}
          expected-workflow: .github/workflows/shipshape-build-inventory.yml
          expected-branch: main
          expected-version: '1.5.5'

  package:
    needs: [validate, build]
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Package and retain unsigned diagnostic inventory
        uses: macadmins/shipshape-action@0ec3587a63e1f0fc18ef0fd4e44f5b8753ab1149
        with:
          phase: package
          expected-repository: macadmins/osquery-extension
          expected-repository-id: '273057431'
          source-sha: ${{ inputs.source_sha }}
          expected-workflow: .github/workflows/shipshape-build-inventory.yml
          expected-branch: main
          expected-version: '1.5.5'
