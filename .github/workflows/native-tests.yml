name: Native tests

on: [push, pull_request]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The race detector needs cgo and a C compiler. Whether the Windows runner provides one
      # is not verified, so Windows runs the same tests without it.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race ./pkg/... ./tables/go_modules/... ./tables/mcp_servers/...

      - name: Test
        if: runner.os == 'Windows'
        run: go test ./pkg/... ./tables/go_modules/... ./tables/mcp_servers/...
